<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OKAWARI · 後台總覽</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e23a2e'/><rect x='7' y='7' width='18' height='18' rx='3' fill='%23f7b32b'/></svg>">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<header><div class="wrap">
  <div class="brand"><i></i>OKAWARI 門頭屏</div>
  <h1>後台總覽</h1>
  <p class="sub">
    三個端各自的狀況。設定進各店的頁面改；
    <b style="color:var(--ink)">按鈕在店端，不在這裡</b>。
  </p>
</div></header>

<div class="wrap">

  <div class="stores" id="stores"></div>

  <div class="card" style="margin-top:20px">
    <h2>總部這邊看得到什麼</h2>
    <div class="log" id="log"></div>
    <p class="note">
      各店發生的事會回報到這裡。真機上這條路是
      <b>店內小主機 → 心跳／回報 → 總部</b>，
      跟「總部下指令給店」是兩條不同方向的路。
    </p>
  </div>

  <div class="card warn">
    <h2>這一頁還不是什麼</h2>
    <p class="note" style="margin-top:0">
      現在三個端的狀態是靠瀏覽器的 BroadcastChannel 湊出來的，
      <b>只在同一台機器、同一個瀏覽器有效</b>。
      真的多店後台要有伺服器收各店的心跳 ——
      這一頁的版型和欄位是先定下來，之後把真的資料接上去，
      三頁的內容往上累加就是總部後台。
    </p>
  </div>

</div>

<script type="module">
import { STORES, loadAll, segmentAt, nowMin, hhmm, bus, EVENTS, CLOSE_AT }
  from './sim.js';

const $ = id => document.getElementById(id);
const B = bus();

$('stores').innerHTML = STORES.map(s => `
  <div class="store">
    <div>
      <h3>${s.short}</h3>
      <div class="sub" style="font-size:13.5px;margin-top:2px">${s.name}</div>
    </div>
    <div class="box"><div class="panel ${s.mirrorOf ? 'mirror' : ''}"
         id="p-${s.id}" style="aspect-ratio:${s.w} / ${s.h}">
      <video id="v-${s.id}" autoplay loop muted playsinline></video>
      <div class="grid"></div><div class="off">已 打 烊</div>
    </div></div>
    <div class="meta">
      <span class="pill" id="st-${s.id}">—</span>
      <span class="pill">${s.w}×${s.h}</span>
      <span class="pill">${s.where}</span>
    </div>
    <div class="meta" id="ev-${s.id}"></div>
    <div class="row" style="margin-top:auto">
      <button class="ghost" onclick="location.href='store.html?id=${s.id}'">設定</button>
      <button class="ghost" onclick="window.open('screen.html?id=${s.id}','_blank')">開店端 ↗</button>
    </div>
  </div>`).join('');

function log(msg) {
  const t = new Date().toTimeString().slice(0, 8);
  $('log').innerHTML = `<div>${t}　${msg}</div>` + $('log').innerHTML;
}

/* 總覽上的縮圖只跟著時段走，不演觸發 ——
   觸發是店端那一瞬間的事，總部看到的是「剛剛發生過」的紀錄，不是即時畫面。 */
function tick() {
  const all = loadAll();
  for (const s of STORES) {
    const st = all[s.id];
    const min = nowMin(st);
    const seg = segmentAt(min);
    const panel = $('p-' + s.id), v = $('v-' + s.id);
    panel.classList.toggle('dark', !seg);

    const pill = $('st-' + s.id);
    if (seg) {
      pill.innerHTML = hhmm(min) + '　' + seg.name;
      pill.className = 'pill on';
      const src = `preview/${seg.key}_${st.character}.mp4`;
      if (v.getAttribute('src') !== src) { v.src = src; v.play().catch(() => {}); }
    } else {
      pill.textContent = hhmm(min) + '　打烊';
      pill.className = 'pill off';
    }

    const ago = st.lastEventAt ? Math.round((Date.now() - st.lastEventAt) / 1000) : null;
    $('ev-' + s.id).innerHTML = st.lastEvent && ago !== null && ago < 3600
      ? `<span class="pill live">最近觸發：${st.lastEvent}　${ago} 秒前</span>`
      : `<span class="pill">最近一小時沒有觸發</span>`;
  }
}

B.on((type, id, data) => {
  const s = STORES.find(x => x.id === id);
  if (!s) return;
  if (type === 'event') log(`<b>${s.short}</b> 觸發 ${EVENTS[data.key].name}`);
  if (type === 'settings') log(`<b>${s.short}</b> 設定更新`);
  tick();
});

setInterval(tick, 1000);
tick();
log('後台就緒。三個端的狀態每秒更新一次。');
</script>
</body>
</html>
